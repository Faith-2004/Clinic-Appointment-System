{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - MedTrack Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary px-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img src="{% static 'images/logo.png' %}" style="height:45px;">
        <div>
            <div style="font-size:1.1rem; font-weight:700;">MedTrack Hospital</div>
            <div style="font-size:0.65rem;">Tracking Care, Saving Lives</div>
        </div>
    </a>
    <a href="/" class="btn btn-outline-light btn-sm">← Back to Home</a>
</nav>

<div class="container py-5">
    <h2 style="font-weight:800; color:#0d6efd;">Contact Us</h2>
    <p class="text-muted">We'd love to hear from you</p>
    <hr>
    <div class="row g-4 mt-2">
        <div class="col-md-4">
            <div style="text-align:center; padding:30px; background:#f8f9ff; border-radius:15px;">
                <div style="font-size:2.5rem;">📍</div>
                <h5 style="font-weight:700; margin-top:15px;">Address</h5>
                <p class="text-muted">123 Health Avenue,<br>Nairobi, Kenya</p>
            </div>
        </div>
        <div class="col-md-4">
            <div style="text-align:center; padding:30px; background:#f8f9ff; border-radius:15px;">
                <div style="font-size:2.5rem;">📞</div>
                <h5 style="font-weight:700; margin-top:15px;">Phone</h5>
                <p class="text-muted">+254 700 123 456<br>+254 711 123 456</p>
            </div>
        </div>
        <div class="col-md-4">
            <div style="text-align:center; padding:30px; background:#f8f9ff; border-radius:15px;">
                <div style="font-size:2.5rem;">✉️</div>
                <h5 style="font-weight:700; margin-top:15px;">Email</h5>
                <p class="text-muted">info@medtrack.co.ke<br>support@medtrack.co.ke</p>
            </div>
        </div>
    </div>

    <!-- Map -->
    <div class="mt-5" style="border-radius:15px; overflow:hidden; box-shadow:0 2px 15px rgba(0,0,0,0.1);">
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d255281.19891888888!2d36.70730744999999!3d-1.3031933999999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x182f1172d84d49a7%3A0xf7cf0254b297924c!2sNairobi%2C%20Kenya!5e0!3m2!1sen!2ske!4v1234567890"
            width="100%"
            height="400"
            style="border:0;"
            allowfullscreen=""
            loading="lazy">
        </iframe>
    </div>
</div>
</body>
</html>
