{% extends 'base.html' %}
{% block content %}

<h3 class="mb-4">👨‍⚕️ Our Doctors</h3>

<div class="row">
    {% for doctor in doctors %}
    <div class="col-md-4 mb-4">
        <div class="card shadow text-center p-4">
            <h1>🩺</h1>
            <h5>Dr. {{ doctor.name }}</h5>
            <p class="text-muted mb-1">{{ doctor.specialization }}</p>
            <p class="mb-1"><small>📞 {{ doctor.phone }}</small></p>
            <p class="mb-3"><small>✉️ {{ doctor.email }}</small></p>
            <span class="badge bg-success">Available</span>
            <div class="mt-3">
                <a href="{% url 'book_appointment' %}" class="btn btn-primary btn-sm">Book Appointment</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="alert alert-info">No doctors available at the moment.</div>
    </div>
    {% endfor %}
</div>

{% endblock %}
