{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h3 class="mb-4">➕ Add New Doctor</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Specialization</label>
                    <input type="text" name="specialization" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Phone</label>
                    <input type="text" name="phone" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" name="available" class="form-check-input" id="available" checked>
                    <label class="form-check-label" for="available">Available for Appointments</label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Add Doctor</button>
                <a href="{% url 'doctor_list' %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
